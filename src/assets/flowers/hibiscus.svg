<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="96" height="96" data-shape="hibiscus">
  <title>Hibiscus</title>
  <!--
    Editable flower. Colours come from the CSS variables flower-base, flower-light, flower-deep and
    flower-cream (each with a lilac fallback in the style attribute). A g element with data-ring="id"
    repeats the element with that id around the centre; add data-variable to let the app change its
    petal count. See README.md in this folder.
  -->
  <defs>
    <path id="hibiscus-petal" d="M0 0C-6.4-3-7-9.4-2.8-11Q-1.2-10 0-10.8Q1.2-10 2.8-11C7-9.4 6.4-3 0 0Z" fill="#d9a3ec" stroke="#eed3f8" stroke-width=".4" style="fill:var(--flower-base,#d9a3ec);stroke:var(--flower-light,#eed3f8)"/>
  </defs>
  <g data-ring="hibiscus-petal" data-count="5" data-offset="0">
    <use href="#hibiscus-petal" transform="rotate(0.0)"/>
    <use href="#hibiscus-petal" transform="rotate(72.0)"/>
    <use href="#hibiscus-petal" transform="rotate(144.0)"/>
    <use href="#hibiscus-petal" transform="rotate(216.0)"/>
    <use href="#hibiscus-petal" transform="rotate(288.0)"/>
  </g>
  <circle r="2.6" fill="#a36bc1" style="fill:var(--flower-deep,#a36bc1)"/>
  <path d="M0 0C2-2 3.2-4.6 4.6-7" fill="none" stroke="#f8d86a" stroke-width=".9" stroke-linecap="round"/>
  <circle cx="3.4" cy="-5.4" r=".85" fill="#f8d86a"/>
  <circle cx="4.6" cy="-7" r=".85" fill="#f8d86a"/>
  <circle cx="5.6" cy="-6" r=".85" fill="#f8d86a"/>
</svg>
