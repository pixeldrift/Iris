<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="96" height="96" data-shape="blossom" data-default-petals="5">
  <title>Blossom</title>
  <!--
    Editable flower. Colours come from the CSS variables flower-base, flower-light, flower-deep and
    flower-cream (each with a lilac fallback in the style attribute). A g element with data-ring="id"
    repeats the element with that id around the centre; add data-variable to let the app change its
    petal count. See README.md in this folder.
  -->
  <defs>
    <ellipse id="blossom-petal" cx="0" cy="-5.2" rx="3.6" ry="5.6" fill="#d9a3ec" style="fill:var(--flower-base,#d9a3ec)"/>
  </defs>
  <g data-ring="blossom-petal" data-count="5" data-offset="0" data-variable="true">
    <use href="#blossom-petal" transform="rotate(0.0)"/>
    <use href="#blossom-petal" transform="rotate(72.0)"/>
    <use href="#blossom-petal" transform="rotate(144.0)"/>
    <use href="#blossom-petal" transform="rotate(216.0)"/>
    <use href="#blossom-petal" transform="rotate(288.0)"/>
  </g>
  <circle r="2.3" fill="#fff" opacity=".92"/>
</svg>
