<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="96" height="96" data-shape="bell">
  <title>Bluebell</title>
  <!--
    Editable flower. Colours come from the CSS variables flower-base, flower-light, flower-deep and
    flower-cream (each with a lilac fallback in the style attribute). A g element with data-ring="id"
    repeats the element with that id around the centre; add data-variable to let the app change its
    petal count. See README.md in this folder.
  -->
  <defs>
  </defs>
  <path d="M0-9.2C0-11 1-11.6 2.2-11.6" fill="none" stroke="#a36bc1" stroke-width="1" style="stroke:var(--flower-deep,#a36bc1)" stroke-linecap="round"/>
  <path d="M-6.4 4C-6.4-4-3.4-9 0-9C3.4-9 6.4-4 6.4 4Q4.8 6.4 3.2 4Q1.6 6.4 0 4Q-1.6 6.4-3.2 4Q-4.8 6.4-6.4 4Z" fill="#d9a3ec" stroke="#eed3f8" stroke-width=".5" style="fill:var(--flower-base,#d9a3ec);stroke:var(--flower-light,#eed3f8)"/>
  <path d="M-2.2 3.6C-3-1-1.6-5.4 0-6.6" fill="none" stroke="#eed3f8" stroke-width=".8" style="stroke:var(--flower-light,#eed3f8)" stroke-linecap="round"/>
  <circle cx="0" cy="6.6" r="1.1" fill="#fff6dc" stroke="#a36bc1" stroke-width=".4" style="fill:var(--flower-cream,#fff6dc);stroke:var(--flower-deep,#a36bc1)"/>
</svg>
