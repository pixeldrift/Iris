<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="96" height="96" data-shape="tulip">
  <title>Tulip</title>
  <!--
    Editable flower. Colours come from the CSS variables flower-base, flower-light, flower-deep and
    flower-cream (each with a lilac fallback in the style attribute). A g element with data-ring="id"
    repeats the element with that id around the centre; add data-variable to let the app change its
    petal count. See README.md in this folder.
  -->
  <defs>
  </defs>
  <path d="M0 4.4L0 11.6" fill="none" stroke="#a36bc1" stroke-width="2" style="stroke:var(--flower-deep,#a36bc1)" stroke-linecap="round"/>
  <path d="M0 10C-4.8 10-7.4 7.4-7.8 4.4C-4 5-1.6 7 0 10Z" fill="#a36bc1" style="fill:var(--flower-deep,#a36bc1)" opacity=".85"/>
  <path d="M0 10C4.8 10 7.4 7.4 7.8 4.4C4 5 1.6 7 0 10Z" fill="#a36bc1" style="fill:var(--flower-deep,#a36bc1)" opacity=".85"/>
  <path d="M-7.6-7C-10-.2-5.8 5.2 0 5.4C-3.4.8-4.2-4.2-7.6-7Z" fill="#d9a3ec" stroke="#d9a3ec" stroke-width="1" stroke-linejoin="round" style="fill:var(--flower-base,#d9a3ec);stroke:var(--flower-base,#d9a3ec)"/>
  <path d="M7.6-7C10-.2 5.8 5.2 0 5.4C3.4.8 4.2-4.2 7.6-7Z" fill="#d9a3ec" stroke="#d9a3ec" stroke-width="1" stroke-linejoin="round" style="fill:var(--flower-base,#d9a3ec);stroke:var(--flower-base,#d9a3ec)"/>
  <path d="M0-11.4C5.6-7.4 7.2-1.2 0 5.4C-7.2-1.2-5.6-7.4 0-11.4Z" fill="#eed3f8" stroke="#d9a3ec" stroke-width=".7" stroke-linejoin="round" style="fill:var(--flower-light,#eed3f8);stroke:var(--flower-base,#d9a3ec)"/>
</svg>
