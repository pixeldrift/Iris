<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="96" height="96" data-shape="lavender">
  <title>Lavender</title>
  <!--
    Editable flower. Colours come from the CSS variables flower-base, flower-light, flower-deep and
    flower-cream (each with a lilac fallback in the style attribute). A g element with data-ring="id"
    repeats the element with that id around the centre; add data-variable to let the app change its
    petal count. See README.md in this folder.
  -->
  <defs>
  </defs>
  <path d="M0 12L0 6" fill="none" stroke="#a36bc1" stroke-width="1.8" style="stroke:var(--flower-deep,#a36bc1)" stroke-linecap="round" opacity=".85"/>
  <ellipse cx="-3.40" cy="5.20" rx="3.95" ry="3.24" fill="#d9a3ec" stroke="#d9a3ec" stroke-width=".6" transform="rotate(-24 -3.40 5.20)" style="fill:var(--flower-base,#d9a3ec);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="3.40" cy="4.00" rx="3.95" ry="3.24" fill="#eed3f8" stroke="#d9a3ec" stroke-width=".6" transform="rotate(24 3.40 4.00)" style="fill:var(--flower-light,#eed3f8);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="-2.98" cy="1.70" rx="3.51" ry="2.88" fill="#eed3f8" stroke="#d9a3ec" stroke-width=".6" transform="rotate(-24 -2.98 1.70)" style="fill:var(--flower-light,#eed3f8);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="2.98" cy="0.50" rx="3.51" ry="2.88" fill="#d9a3ec" stroke="#d9a3ec" stroke-width=".6" transform="rotate(24 2.98 0.50)" style="fill:var(--flower-base,#d9a3ec);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="-2.56" cy="-1.80" rx="3.07" ry="2.52" fill="#d9a3ec" stroke="#d9a3ec" stroke-width=".6" transform="rotate(-24 -2.56 -1.80)" style="fill:var(--flower-base,#d9a3ec);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="2.56" cy="-3.00" rx="3.07" ry="2.52" fill="#eed3f8" stroke="#d9a3ec" stroke-width=".6" transform="rotate(24 2.56 -3.00)" style="fill:var(--flower-light,#eed3f8);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="-2.14" cy="-5.30" rx="2.63" ry="2.16" fill="#eed3f8" stroke="#d9a3ec" stroke-width=".6" transform="rotate(-24 -2.14 -5.30)" style="fill:var(--flower-light,#eed3f8);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="2.14" cy="-6.50" rx="2.63" ry="2.16" fill="#d9a3ec" stroke="#d9a3ec" stroke-width=".6" transform="rotate(24 2.14 -6.50)" style="fill:var(--flower-base,#d9a3ec);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="-1.72" cy="-8.80" rx="2.19" ry="1.80" fill="#d9a3ec" stroke="#d9a3ec" stroke-width=".6" transform="rotate(-24 -1.72 -8.80)" style="fill:var(--flower-base,#d9a3ec);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="1.72" cy="-10.00" rx="2.19" ry="1.80" fill="#eed3f8" stroke="#d9a3ec" stroke-width=".6" transform="rotate(24 1.72 -10.00)" style="fill:var(--flower-light,#eed3f8);stroke:var(--flower-base,#d9a3ec)"/>
  <ellipse cx="0" cy="-10.2" rx="2.2" ry="2.9" fill="#a36bc1" style="fill:var(--flower-deep,#a36bc1)"/>
</svg>
